version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin <account_id>.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  build:
    commands:
      - docker build -t devbank-frontend .
      - docker tag devbank-frontend:latest <account_id>.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/devbank-frontend:latest
  post_build:
    commands:
      - docker push <account_id>.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/devbank-frontend:latest
